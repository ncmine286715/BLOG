<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentos Legais</title>

<style>
:root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --border-color: #30363d;
    --text-primary: #f0f6fc;
    --text-secondary: #8b949e;
    --accent-green: #3fb950;
    --font-primary: 'Inter', sans-serif;
}

body {
    margin: 0;
    font-family: var(--font-primary);
    background: var(--bg-primary);
    color: var(--text-primary);
}

.wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 50px 20px;
}

h1 {
    color: var(--accent-green);
    font-size: 2rem;
    margin-bottom: 8px;
}

p {
    color: var(--text-secondary);
    font-size: 0.95rem;
}

.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    margin-top: 18px;
    transition: 0.2s;
}

.card:hover {
    border-color: var(--accent-green);
    transform: translateY(-2px);
}

a {
    text-decoration: none;
    color: var(--text-primary);
    display: block;
}

.title {
    font-weight: 700;
    color: var(--accent-green);
    margin-bottom: 6px;
}

.small {
    font-size: 0.85rem;
    color: var(--text-secondary);
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Documentos Legais</h1>
<p>Central de informações do aplicativo NCMINE Addon Finder</p>

<!-- LINKS PARA OUTRAS PÁGINAS -->
<a href="privacy.html">
<div class="card">
    <div class="title">Política de Privacidade</div>
    <div class="small">Como dados são coletados e usados no aplicativo</div>
</div>
</a>

<a href="terms.html">
<div class="card">
    <div class="title">Termos de Uso</div>
    <div class="small">Regras de utilização do aplicativo</div>
</div>
</a>

<a href="mailto:ncmine75@gmail.com">
<div class="card">
    <div class="title">Contato</div>
    <div class="small">Suporte e dúvidas gerais</div>
</div>
</a>

</div>

</body>
</html>
