          "@type": "Question",
          "name": "Qual a diferença entre chipset B650, X670E e X870E?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "B650 é o chipset de entrada para AM5, com suporte a PCIe Gen5 apenas no slot da placa de vídeo. X670E tem dois chipsets, oferecendo mais linhas PCIe Gen5 e mais conectividade. X870E é o topo de linha, com suporte nativo a USB4 e mais opções de expansão. Para servidores, X670E já é suficiente; X870E é para quem quer o máximo."
          }
        },
        {
          "@type": "Question",
          "name": "Quantas fases de energia (VRM) são necessárias para um servidor 24/7?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para um Ryzen 7 ou Intel i7, 12+2 fases de qualidade já são suficientes. Para Ryzen 9 ou i9, recomenda-se 16+2 ou mais. O mais importante é a qualidade dos componentes (DrMOS, capacitores japoneses) e o resfriamento do VRM, já que o servidor fica ligado direto."
          }
        },
        {
          "@type": "Question",
          "name": "Qual placa-mãe o Nick usa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No meu PC pessoal, uso uma ASUS TUF Gaming B550-Plus (AM4, chipset B550). Ela tem 8+2 fases de energia, VRM com dissipador, e segura meu Ryzen 7 5800X sem problemas há anos. Para um servidor novo, eu iria de B650 ou X670E."
          }
        }
      ]
